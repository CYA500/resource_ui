name: resource_ui
description: "A professional PC resource monitor with remote commands."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # المكتبات الثلاث الأساسية التي طلبتها
  web_socket_channel: ^3.0.1
  mobile_scanner: ^5.1.1
  glass_kit: ^3.0.0
  
  # مكتبة إضافية للتعامل مع البيانات بسهولة
  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
